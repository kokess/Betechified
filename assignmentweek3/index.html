<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Portal</title>
    <!-- Link to External CSS File -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- 1. Navigation Bar with Links (Home, About, Contact Us) -->
    <nav class="navbar">
        <div class="logo">StudentPortal</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact Us</a></li>
        </ul>
    </nav>

    <main class="container">
        <!-- 2. Featured Image Section -->
        <section class="image-section">
            <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80"
                alt="Students Studying" class="featured-image">
        </section>

        <!-- 3. Table with Student Data (Name, Class, Grade) -->
        <section class="table-section">
            <h2>Student Performance Records</h2>
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Student Class</th>
                        <th>Student Grade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Austine Dominic Essien</td>
                        <td>Web Development 101</td>
                        <td>A</td>
                    </tr>
                    <tr>
                        <td>Sarah Johnson</td>
                        <td>Computer Science II</td>
                        <td>A-</td>
                    </tr>
                    <tr>
                        <td>Michael Smith</td>
                        <td>Data Analytics</td>
                        <td>B+</td>
                    </tr>
                    <tr>
                        <td>Emily Davis</td>
                        <td>Web Development 101</td>
                        <td>A</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

</body>

</html>
